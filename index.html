<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#391520"><meta name="description" content="Ganesha's Modak Mission — a respectful Ganesh Chaturthi stealth and festival-preparation adventure."><title>Ganesha’s Modak Mission — Contest Polish v3</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23651f32'/%3E%3Cpath d='M9 34Q11 24 24 10Q37 24 39 34Q24 43 9 34' fill='%23f6cb73'/%3E%3C/svg%3E"><link rel="stylesheet" href="./src/style.css"></head>
<body><main id="app"><header class="topbar"><div class="brand"><span class="brand-mark">✦</span><div><span class="eyebrow">GANESH CHATURTHI</span><h1>Ganesha’s Modak Mission</h1></div></div><div class="top-actions"><button id="sound" title="Toggle sound" aria-label="Turn sound on">Sound off</button><button id="pause" aria-label="Pause game">Pause</button></div></header>
<section class="game-shell" aria-label="Playable game"><div class="hud"><div class="hud-stat"><span>MODAKS</span><strong id="count">0 <small>/ 5</small></strong></div><div class="hud-stat"><span>SCORE</span><strong id="score">0</strong></div><div class="countdown"><span>TIME</span><strong id="timer">00:00</strong></div><div class="awareness"><span id="state-label">PARVATI · CALM</span><div class="meter"><i id="awareness-fill"></i></div></div><button id="objectives" class="objectives-btn">OBJECTIVES</button></div>
<canvas id="game" tabindex="0" role="img" aria-label="Festival stealth game. Move with WASD or arrow keys, Shift to run, E to interact, Space to hide, Q to switch to Mushak when available, Tab for objectives, Escape to pause."></canvas>
<div class="world-label"><span class="live-dot"></span><span id="location">THE FESTIVAL COURTYARD</span></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="tutorial" class="tutorial" role="status"></div><div id="current-objective" class="current-objective"></div><div id="context" class="context"></div>
<div class="touch-controls" aria-label="Mobile controls"><div class="dpad"><button data-dir="up" aria-label="Move up">▲</button><button data-dir="left" aria-label="Move left">◀</button><button data-dir="down" aria-label="Move down">▼</button><button data-dir="right" aria-label="Move right">▶</button></div><div class="touch-actions"><button id="touch-interact">USE</button><button id="touch-hide">HIDE</button><button id="touch-run">RUN<span>hold</span></button><button id="touch-switch">MUSHAK</button></div></div>
<div id="overlay" class="overlay"><section class="modal" id="modal" aria-label="Game menu" role="dialog" aria-modal="true"></section></div></section>
<footer><span class="desktop-hints"><kbd>W A S D</kbd> Move <b>·</b> <kbd>Shift</kbd> Run <b>·</b> <kbd>E</kbd> Interact <b>·</b> <kbd>Space</kbd> Hide <b>·</b> <kbd>Q</kbd> Switch <b>·</b> <kbd>Tab</kbd> Objectives <b>·</b> <kbd>Esc</kbd> Pause</span><span class="footer-note">Sneak. Solve. Celebrate.</span></footer></main><script src="./supabase-config.js" onerror="this.remove()"></script><script type="module" src="./src/main.js"></script></body></html>
